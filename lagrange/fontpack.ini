# Pretendard as a Lagrange fontpack: Korean and Latin for the page and the UI.
version = "1.3.9"

[pretendard]
name     = "Pretendard"
regular  = "Pretendard-Regular.otf"
semibold = "Pretendard-SemiBold.otf"
bold     = "Pretendard-Bold.otf"

[pretendard-hangul]
# The same font as a fallback, so Hangul shows in whatever font is chosen.
name      = "Pretendard (Hangul)"
auxiliary = true
priority  = 1
regular   = "Pretendard-Regular.otf"
